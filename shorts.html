<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body { margin:0; padding:0; background: transparent; }

.shorts-wrapper {
  display: grid;
  gap: 16px;
  padding: 8px;
}

.shorts-item {
  position: relative;
  width: 100%;
  aspect-ratio: 9 / 16;
  border-radius: 12px;
  overflow: hidden;
  background: transparent;
}

.shorts-item iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
}

/* PC：4列 */
@media (min-width: 768px) {
  .shorts-wrapper {
    grid-template-columns: repeat(4, 1fr);
  }
}

/* スマホ：カルーセル */
@media (max-width: 767px) {
  .shorts-wrapper {
    display: flex;
    gap: 12px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
  }

  .shorts-item {
    flex: 0 0 80%;
    scroll-snap-align: start;
  }

  .shorts-wrapper::-webkit-scrollbar {
    display: none;
  }
}
</style>
</head>
<body>
<div class="shorts-wrapper">

  <div class="shorts-item">
    <iframe
      src="https://www.youtube.com/embed/A9pOVCzGNKA"
      allowfullscreen
      loading="lazy">
    </iframe>
  </div>
  <div class="shorts-item">
    <iframe
      src="https://www.youtube.com/embed/hhOu2L123-E"
      allowfullscreen
      loading="lazy">
    </iframe>
  </div>
  <div class="shorts-item">
    <iframe
      src="https://www.youtube.com/embed/ztzby-DGVCI"
      allowfullscreen
      loading="lazy">
    </iframe>
  </div>
  <div class="shorts-item">
    <iframe
      src="https://www.youtube.com/embed/lAuZXBpG2rw"
      allowfullscreen
      loading="lazy">
    </iframe>
  </div>
</div>
</body>
</html>
